name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc (conventional Linux build): dynamic, floor GLIBC_2.17
          - { os: ubuntu-latest,  target: x86_64-linux-gnu.2.17,  out: ztress-linux-x86_64,        asset: ztress-linux-x86_64.tar.gz,       libc: true  }
          - { os: ubuntu-latest,  target: aarch64-linux-gnu.2.17, out: ztress-linux-aarch64,       asset: ztress-linux-aarch64.tar.gz,      libc: true  }
          # musl (portable static Linux build)
          - { os: ubuntu-latest,  target: x86_64-linux-musl,      out: ztress-linux-x86_64-musl,   asset: ztress-linux-x86_64-musl.tar.gz,  libc: true  }
          - { os: ubuntu-latest,  target: aarch64-linux-musl,     out: ztress-linux-aarch64-musl,  asset: ztress-linux-aarch64-musl.tar.gz, libc: true  }
          # macOS
          - { os: macos-latest,   target: x86_64-macos,           out: ztress-macos-x86_64,        asset: ztress-macos-x86_64.tar.gz,       libc: false }
          - { os: macos-latest,   target: aarch64-macos,          out: ztress-macos-aarch64,       asset: ztress-macos-aarch64.tar.gz,      libc: false }
          # Windows
          - { os: windows-latest, target: x86_64-windows,         out: ztress-windows-x86_64.exe,  asset: ztress-windows-x86_64.exe,        libc: false }
          - { os: windows-latest, target: aarch64-windows,        out: ztress-windows-aarch64.exe, asset: ztress-windows-aarch64.exe,       libc: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build ${{ matrix.target }}
        shell: bash
        run: |
          zig build -Doptimize=fast -Dstrip=true \
            -Dtarget=${{ matrix.target }} -Dlibc=${{ matrix.libc }}
          bin=zig-out/bin/ztress
          case "${{ matrix.target }}" in *windows*) bin="$bin.exe" ;; esac
          cp "$bin" "${{ matrix.out }}"
          if [ "${{ matrix.out }}" != "${{ matrix.asset }}" ]; then
            tar -czf "${{ matrix.asset }}" "${{ matrix.out }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true